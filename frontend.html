<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F0F0E6;
    --surface: #FFFDF8;
    --ink: #1F2A24;
    --ink-soft: #4A554E;
    --pine: #3D6B4F;
    --pine-dark: #2C4F39;
    --walnut: #8B5E3C;
    --rule: #D8D6C8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  .kicker {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(34px, 6vw, 46px);
    line-height: 1.1;
    margin: 0 0 36px;
    letter-spacing: -0.01em;
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 8px;
  }

  input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 18px;
    color: var(--ink);
    padding: 6px 0;
  }

  input::placeholder { color: #9A9686; }
  input:focus { outline: none; }

  input:focus-visible {
    outline: 2px solid var(--pine);
    outline-offset: 4px;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--surface);
    background: var(--pine);
    border: none;
    padding: 10px 20px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }

  button:hover { background: var(--pine-dark); }

  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  button:disabled {
    background: #B7C3BB;
    cursor: default;
  }

  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 40px;
  }

  #result {
    display: none;
  }

  #result.visible {
    display: block;
    animation: rise 0.4s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-card {
    background: var(--surface);
    border-left: 3px solid var(--walnut);
    padding: 22px 24px;
    font-size: 16px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .error-card {
    background: var(--surface);
    border-left: 3px solid #A3453A;
    padding: 22px 24px;
    font-size: 15px;
    color: #A3453A;
  }

  @media (prefers-reduced-motion: reduce) {
    #result.visible { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <p class="kicker">Reference desk</p>
    <h1>What do you want<br>to know?</h1>

    <form id="ask-form">
      <input id="question" type="text" placeholder="Ask a question..." autocomplete="off" required />
      <button id="submit-btn" type="submit">Ask</button>
    </form>
    <p class="hint">Answers are grounded in the knowledge base — not guessed.</p>

    <div id="result"></div>
  </main>

  <script>
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');
    const button = document.getElementById('submit-btn');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      button.disabled = true;
      button.textContent = 'Asking...';
      result.className = '';
      result.innerHTML = '';

      try {
        const res = await fetch('http://localhost:3000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'demo-user', question }),
        });
        const data = await res.json();

        if (data.answer) {
          const billedNote = data.billing?.billed
            ? 'Billed as one answer'
            : 'Counted toward your free answers';
          result.innerHTML = `
            <div class="answer-card">${data.answer}</div>
            <p class="meta">${billedNote}</p>
          `;
        } else {
          result.innerHTML = `<div class="error-card">${data.error || 'Something went wrong.'}</div>`;
        }
      } catch (err) {
        result.innerHTML = `<div class="error-card">Couldn't reach the server. Is it running?</div>`;
      }

      result.classList.add('visible');
      button.disabled = false;
      button.textContent = 'Ask';
    });
  </script>
</body>
</html>
